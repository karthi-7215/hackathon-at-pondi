<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f131c" />
  <title>LifeSync AI — Personal Intelligence & Obligation OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  
  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti for Celebration Effects -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    /* ================= DESIGN SYSTEM TOKENS ================= */
    :root {
      --bg-app: #0f131c;
      --bg-sidebar: #0a0e17;
      --bg-card: #181b25;
      --bg-card-hover: #1f2330;
      --bg-item: #1c1f29;
      --bg-item-soft: rgba(28, 31, 41, 0.6);
      --bg-chip: #262a34;
      --bg-chip-strong: #31353f;
      --bg-reasoning: rgba(10, 14, 23, 0.85);
      --bg-header: rgba(15, 19, 28, 0.88);

      --text-primary: #dfe2ef;
      --text-secondary: #c2c6d6;
      --text-muted: #8c909f;

      --blue: #4d8eff;
      --blue-soft: #adc6ff;
      --indigo: #c0c1ff;
      --violet: #d0bcff;
      --violet-glow: #a078ff;
      --emerald: #50e3c2;
      --emerald-bg: rgba(80, 227, 194, 0.15);
      --amber: #ffb74d;
      --danger: #93000a;
      --danger-soft: #ffb4ab;
      --danger-text: #ffdad6;
      --danger-bg: rgba(147, 0, 10, 0.35);
      --indigo-bg: rgba(49, 49, 192, 0.4);
      --indigo-badge: #3131c0;
      --indigo-badge-text: #b0b2ff;
      --on-blue: #00285d;
      --on-blue-soft: #002e6a;

      --font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      --font-body: "Inter", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;

      --r-xs: 4px;
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --r-xl: 22px;
      --r-pill: 9999px;

      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.25);
      --shadow-hero: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
      --shadow-glow: 0 0 24px rgba(77, 142, 255, 0.25);

      --sidebar-w: 280px;
      --header-h: 64px;
      --content-max: 1040px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { height: 100%; }
    body {
      margin: 0;
      background: var(--bg-app);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 20px;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, p { margin: 0; }
    ul { list-style: none; margin: 0; padding: 0; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    svg { display: block; flex-shrink: 0; }
    :focus-visible { outline: 2px solid var(--blue-soft); outline-offset: 2px; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-chip-strong); border-radius: var(--r-pill); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Shell & Layout */
    .shell { min-height: 100%; display: flex; flex-direction: column; }
    .main { margin-left: var(--sidebar-w); min-width: 0; flex: 1; display: flex; flex-direction: column; }
    .content {
      position: relative;
      max-width: var(--content-max);
      margin: 0 auto;
      width: 100%;
      padding: 32px 24px 72px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Ambient Glow Aura */
    .aura { position: absolute; inset: 0 0 auto 0; height: 320px; overflow: hidden; pointer-events: none; }
    .aura__a { position: absolute; border-radius: var(--r-pill); left: 20%; width: 45%; height: 380px; top: -96px; background: rgba(77, 142, 255, 0.12); filter: blur(60px); }
    .aura__b { position: absolute; border-radius: var(--r-pill); left: 10%; width: 55%; height: 320px; top: -112px; background: rgba(160, 120, 255, 0.15); filter: blur(70px); }

    /* Sidebar */
    .sidebar {
      position: fixed; inset: 0 auto 0 0;
      width: var(--sidebar-w);
      background: var(--bg-sidebar);
      display: flex; flex-direction: column;
      z-index: 40;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }
    .sidebar__brand { height: var(--header-h); padding: 0 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
    .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .brand__logo {
      width: 34px; height: 34px; border-radius: var(--r-sm);
      display: grid; place-items: center;
      color: var(--blue-soft);
      background: linear-gradient(140deg, rgba(77,142,255,.3), rgba(160,120,255,.3));
      box-shadow: inset 0 0 0 1px rgba(173,198,255,.3);
    }
    .brand__name { font: 700 16px/24px var(--font-display); letter-spacing: -0.4px; }
    .sidebar__nav { flex: 1; overflow-y: auto; padding: 12px 8px; display: flex; flex-direction: column; gap: 14px; }
    .nav-section { display: flex; flex-direction: column; gap: 3px; }
    .nav-section__label { padding: 4px 10px 6px; font: 600 11px/14px var(--font-body); letter-spacing: .6px; text-transform: uppercase; color: var(--text-muted); }
    .nav-link {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 12px; min-height: 36px; border-radius: var(--r-sm);
      font: 500 13px/18px var(--font-body); color: var(--text-secondary);
      transition: all .15s ease;
    }
    .nav-link:hover { background: var(--bg-item); color: var(--text-primary); }
    .nav-link__main { display: flex; align-items: center; gap: 10px; }
    .nav-link--active, .nav-link--active:hover { background: var(--blue); color: var(--on-blue); font-weight: 600; box-shadow: 0 4px 12px rgba(77,142,255,0.3); }
    .nav-badge { padding: 2px 7px; border-radius: var(--r-pill); font: 700 10px/12px var(--font-mono); }
    .nav-badge--indigo { background: var(--indigo-badge); color: var(--indigo-badge-text); }
    .nav-badge--neutral { background: var(--bg-chip); color: var(--blue-soft); }
    .nav-badge--danger { background: var(--danger); color: var(--danger-text); }
    .nav-badge--emerald { background: var(--emerald-bg); color: var(--emerald); }

    .sidebar__footer { padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg-sidebar); border-top: 1px solid rgba(255,255,255,0.04); }
    .status-card { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--bg-item); border: 1px solid rgba(255,255,255,0.04); }
    .status-card__text { min-width: 0; }
    .status-card__title { font: 600 12px/16px var(--font-body); color: var(--text-primary); }
    .status-card__sub { font: 400 11px/15px var(--font-body); color: var(--text-muted); }
    .profile { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 0; }
    .profile__who { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .profile__name { font: 600 13px/18px var(--font-body); }
    .profile__email { font: 400 11px/14px var(--font-body); color: var(--text-muted); }
    .scrim { display: none; }

    /* Header */
    .header {
      position: sticky; top: 0; z-index: 30;
      height: var(--header-h);
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 0 28px;
      background: var(--bg-header);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      box-shadow: 0 1px 10px rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .header__menu { display: none; }
    .search { position: relative; flex: 1; min-width: 0; max-width: 480px; }
    .search__icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
    .search__input {
      width: 100%; height: 40px; padding: 0 56px 0 38px;
      background: var(--bg-card); color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: var(--r-sm);
      font: 400 13px/normal var(--font-body);
      transition: all .15s ease;
    }
    .search__input:focus { outline: none; border-color: rgba(173,198,255,.6); box-shadow: 0 0 0 3px rgba(77, 142, 255, 0.25); }
    .search__kbd {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      padding: 3px 6px; border-radius: var(--r-xs); background: var(--bg-chip);
      font: 600 10px/12px var(--font-mono); color: var(--text-secondary);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .search-dropdown {
      position: absolute; top: calc(100% + 8px); left: 0; right: 0;
      background: var(--bg-card); border-radius: var(--r-md);
      box-shadow: 0 16px 36px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1);
      max-height: 360px; overflow-y: auto; z-index: 60; padding: 6px;
    }
    .search-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-radius: var(--r-sm); cursor: pointer;
      transition: background .15s;
    }
    .search-item:hover { background: var(--bg-item); }
    .search-item__title { font-weight: 500; font-size: 13px; color: var(--text-primary); }
    .search-item__type { font-size: 11px; font-weight: 600; color: var(--blue-soft); background: var(--bg-chip); padding: 2px 8px; border-radius: var(--r-pill); }

    .header__actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .header__divider { width: 1px; height: 28px; background: var(--bg-chip-strong); margin: 0 4px; }
    .header__bell { position: relative; }
    .header__bell-dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--blue-soft); box-shadow: 0 0 6px var(--blue-soft); }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 38px; padding: 0 16px; border-radius: var(--r-sm);
      font: 600 12px/16px var(--font-body); letter-spacing: .2px; white-space: nowrap;
      transition: all .15s ease;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(1px); filter: brightness(0.95); }
    .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .btn--sm { height: 32px; padding: 0 12px; font-size: 12px; }
    .btn--xs { height: auto; padding: 4px 8px; font-size: 11px; font-weight: 600; border-radius: var(--r-xs); }
    .btn--lg { height: 46px; border-radius: var(--r-md); font-size: 14px; letter-spacing: .1px; font-weight: 700; }
    .btn--blue { background: var(--blue); color: var(--on-blue); box-shadow: 0 2px 10px rgba(77, 142, 255, 0.3); }
    .btn--soft-blue { background: var(--blue-soft); color: var(--on-blue-soft); font-weight: 700; padding: 0 22px; box-shadow: 0 4px 14px rgba(77, 142, 255, 0.35); }
    .btn--emerald { background: var(--emerald); color: #00382b; font-weight: 700; box-shadow: 0 4px 14px rgba(80, 227, 194, 0.35); }
    .btn--chip { background: var(--bg-chip-strong); color: var(--text-primary); border: 1px solid rgba(255,255,255,0.06); }
    .btn--lg.btn--chip { background: var(--bg-chip); }
    .btn--ghost-violet { background: rgba(208, 188, 255, 0.08); color: var(--violet); border: 1px solid rgba(208, 188, 255, 0.25); box-shadow: 0 0 12px rgba(160, 120, 255, 0.15); }
    .btn--text { height: 36px; padding: 0 10px; color: var(--text-secondary); }
    .btn--text:hover:not(:disabled) { background: var(--bg-chip); color: var(--text-primary); filter: none; }
    .btn--danger-ghost { color: var(--danger-soft); border: 1px solid rgba(255, 180, 171, 0.2); }
    .btn--danger-ghost:hover:not(:disabled) { background: var(--danger-bg); }

    .icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: var(--r-sm); color: var(--text-secondary); transition: all .15s; }
    .icon-btn:hover { background: var(--bg-chip); color: var(--text-primary); }
    .icon-btn--sm { width: 30px; height: 30px; }

    .link-btn { display: inline-flex; align-items: center; gap: 4px; font: 600 11px/14px var(--font-body); letter-spacing: .4px; color: var(--text-muted); text-decoration: underline; }
    .link-btn:hover:not(:disabled) { color: var(--text-primary); }
    .link-btn--indigo { color: var(--indigo); text-decoration: none; }
    .link-btn--indigo:hover:not(:disabled) { color: var(--text-primary); }

    /* Chips, Badges & Utilities */
    .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: var(--r-pill); background: var(--bg-chip); font: 600 11px/14px var(--font-body); letter-spacing: .4px; color: var(--text-secondary); }
    .chip--blue-text { border-radius: var(--r-xs); padding: 2px 6px; color: var(--blue-soft); font-family: var(--font-mono); font-size: 10px; font-weight: 700; }
    .chip--sync { background: var(--bg-card); padding: 6px 12px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: background .15s; }
    .chip--sync:hover { background: var(--bg-chip); }
    .chip--engine { padding: 6px 12px; color: var(--violet); background: rgba(208, 188, 255, 0.08); border: 1px solid rgba(208, 188, 255, 0.2); box-shadow: var(--shadow-card); }
    .chip--count { color: var(--text-secondary); font-weight: 700; font-family: var(--font-mono); }
    .chip--live { border-radius: var(--r-xs); padding: 3px 8px; background: rgba(208,188,255,.12); color: var(--violet); font-weight: 700; }
    .chip--urgent { padding: 4px 10px; background: var(--danger); color: var(--danger-text); letter-spacing: 0.8px; text-transform: uppercase; font-weight: 700; }
    .chip--confidence { padding: 4px 10px; color: var(--violet); background: rgba(208, 188, 255, 0.08); font-weight: 600; }

    .dot { width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--text-muted); flex-shrink: 0; }
    .dot--violet { background: var(--violet); }
    .dot--blue { background: var(--blue-soft); }
    .dot--indigo { background: var(--indigo); }
    .dot--emerald { background: var(--emerald); box-shadow: 0 0 6px var(--emerald); }
    .dot--danger { background: var(--danger-soft); }
    .dot--pink { width: 6px; height: 6px; background: var(--danger-text); }

    .sep { color: var(--text-muted); }
    .mono { font: 700 13px/20px var(--font-mono); color: var(--blue-soft); }
    .accent { color: var(--blue-soft); }
    .eyebrow { font: 600 11px/14px var(--font-body); letter-spacing: .6px; text-transform: uppercase; color: var(--text-muted); }
    .eyebrow--icon { display: flex; align-items: center; gap: 5px; }
    .avatar { display: inline-grid; place-items: center; border-radius: var(--r-pill); overflow: hidden; background: linear-gradient(140deg, #4d8eff, #a078ff); font: 700 12px/1 var(--font-body); color: #fff; flex-shrink: 0; }

    /* Cards */
    .card { background: var(--bg-card); border-radius: var(--r-lg); box-shadow: var(--shadow-card); border: 1px solid rgba(255, 255, 255, 0.04); }

    /* Greeting Section */
    .greeting { position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 8px; }
    .greeting__copy { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; max-width: 640px; }
    .greeting__title { font: 800 38px/46px var(--font-display); letter-spacing: -1px; }
    .greeting__lead { font: 600 17px/24px var(--font-display); letter-spacing: -.2px; color: var(--text-secondary); }
    .greeting__lead strong { font-weight: 700; color: var(--blue-soft); }
    .metrics { display: flex; gap: 12px; flex-shrink: 0; }
    .metric { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--bg-card); border-radius: var(--r-md); border: 1px solid rgba(255,255,255,0.04); }
    .metric__icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: var(--r-sm); background: var(--bg-chip); color: var(--blue-soft); }
    .metric__label { font: 600 11px/14px var(--font-body); letter-spacing: .6px; text-transform: uppercase; color: var(--text-muted); }
    .metric__value { font: 700 16px/24px var(--font-display); }
    .metric__delta { font-size: 12px; color: var(--danger-soft); font-family: var(--font-mono); }

    /* Hero Priority Card */
    .hero { position: relative; overflow: hidden; box-shadow: var(--shadow-hero); border: 1px solid rgba(255,255,255,0.06); }
    .hero__glow { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(160,120,255,.14), rgba(77,142,255,.08) 50%, rgba(77,142,255,0)); pointer-events: none; }
    .hero__edge { position: absolute; inset: 0 auto 0 0; width: 6px; background: linear-gradient(180deg, var(--violet), var(--blue) 50%, var(--indigo)); }
    .hero__body { position: relative; padding: 32px; display: flex; flex-direction: column; gap: 20px; }
    .hero__meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .hero__badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .hero__detected { display: inline-flex; align-items: center; gap: 5px; font: 500 12px/16px var(--font-body); color: var(--text-muted); }
    .hero__head { display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); gap: 24px; }
    .hero__titles { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .hero__title { font: 800 28px/36px var(--font-display); letter-spacing: -.6px; }
    .hero__sub { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 400 14px/22px var(--font-body); }
    .tag { padding: 2px 8px; border-radius: var(--r-xs); background: var(--bg-item); font-weight: 600; }
    .hero__expiry { display: flex; align-items: center; gap: 6px; font: 600 14px/22px var(--font-body); color: var(--danger-soft); }
    .hero__price { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
    .hero__amount { font: 800 40px/48px var(--font-display); letter-spacing: -1px; color: #ffffff; }
    .hero__recommend { display: flex; align-items: center; gap: 4px; padding-top: 4px; font: 600 12px/16px var(--font-body); color: var(--blue-soft); }

    .reasoning { display: flex; flex-direction: column; gap: 12px; padding: 20px 18px; border-radius: var(--r-md); background: var(--bg-reasoning); border: 1px solid rgba(255,255,255,0.04); }
    .reasoning__flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .reasoning__step { display: inline-flex; align-items: center; gap: 8px; }
    .reasoning__arrow { color: var(--text-muted); }
    .flow-tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: var(--r-sm); background: var(--bg-chip); font: 500 12px/16px var(--font-body); }
    .flow-tag__src { color: var(--text-muted); font-weight: 600; }
    .flow-tag__detail { font-weight: 500; }
    .reasoning__narrative { font: 400 14px/22px var(--font-body); color: var(--text-secondary); }
    .reasoning__narrative strong { font-weight: 600; color: var(--text-primary); }
    .reasoning__narrative strong.accent { color: var(--blue-soft); }

    .hero__actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 8px; }
    .hero__primary, .hero__secondary { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    /* Workspace 2-Column */
    .workspace { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; align-items: start; }
    .workspace__col { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
    .workspace__col--main { grid-column: 1 / span 7; }
    .workspace__col--side { grid-column: 8 / span 5; }

    .panel { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
    .panel__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .panel__title-group { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .panel__icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: var(--r-sm); background: var(--bg-chip); color: var(--blue-soft); flex-shrink: 0; }
    .panel__title { font: 700 18px/24px var(--font-display); letter-spacing: -.2px; }
    .panel__sub { font: 400 12px/18px var(--font-body); color: var(--text-muted); }
    .panel__range { font: 600 11px/14px var(--font-mono); color: var(--text-muted); white-space: nowrap; }

    .stack { display: flex; flex-direction: column; gap: 10px; }
    .stack--tight { gap: 8px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: var(--r-md); background: var(--bg-item); border: 1px solid rgba(255,255,255,0.03); transition: all .15s ease; }
    .row:hover { background: var(--bg-card-hover); border-color: rgba(255,255,255,0.08); }
    .row--soft { padding: 10px 14px; background: var(--bg-item-soft); }
    .row__main { display: flex; align-items: flex-start; gap: 12px; min-width: 0; flex: 1; }
    .row__main--center { align-items: center; }

    function playCelebrationChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.001, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.25, now + idx * 0.08 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.6);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.7);
        });
      } catch (e) {}

    // Device Database Storage Manager
    const DB_STORAGE_KEY = "LIFESYNC_AI_DEVICE_DB_V3";

    const DeviceDatabase = {
      async load() {
        try {
          const serverRes = await fetch("/api/dashboard");
          if (serverRes.ok) {
            const data = await serverRes.json();
            if (data && data.user) {
              localStorage.setItem(DB_STORAGE_KEY, JSON.stringify(data));
              return data;
            }
          }
        } catch (e) {}

        try {
          const stored = localStorage.getItem(DB_STORAGE_KEY);
          if (stored) {
            const parsed = JSON.parse(stored);
            if (!parsed.timelineEvents) parsed.timelineEvents = defaultDatabase.timelineEvents;
            if (!parsed.automations) parsed.automations = defaultDatabase.automations;
            return parsed;
          }
        } catch (e) {
          console.error("Device database read error, fallback to defaults", e);
        }

        localStorage.setItem(DB_STORAGE_KEY, JSON.stringify(defaultDatabase));
        return JSON.parse(JSON.stringify(defaultDatabase));
      },

      async save(data) {
        try {
          localStorage.setItem(DB_STORAGE_KEY, JSON.stringify(data));
          fetch("/api/sync", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          }).catch(() => {});
        } catch (e) {
          console.error("Device database write error", e);
        }
      },

      reset() {
        localStorage.removeItem(DB_STORAGE_KEY);
        return JSON.parse(JSON.stringify(defaultDatabase));
      }
    };

    // Real AI Service: Interacts with Live Neural LLM Engine & Context Injection
    async function queryLiveAI(prompt, conversationHistory, dbContext) {
      // Build a comprehensive system prompt summarizing user's real live database
      const liveContextSummary = [
        "USER CONTEXT:",
        `Name: ${dbContext.user.name} (${dbContext.user.email})`,
        `Cognitive Load: ${dbContext.metrics.cognitiveLoadPct}% (Strain: ${dbContext.metrics.cognitiveLoadDeltaPct}% higher)`,
        `Critical Obligations Count: ${dbContext.metrics.criticalObligations}`,
        `Priority Obligation: ${dbContext.priority.title} (${dbContext.priority.provider}) - Amount: ₹${dbContext.priority.amount} - Expiry: ${dbContext.priority.expiryLabel} - Status: ${dbContext.priority.completed ? "Paid & Endorsed" : "Pending"}`,
        `Admin Tasks: ${dbContext.adminItems.map(i => i.title + " (" + (i.completed ? "Done" : "Pending") + ")").join(", ")}`,
        `Upcoming Timeline Events: ${dbContext.timelineEvents.map(t => t.title + " on " + t.date + " (" + (t.completed ? "Done" : "Pending") + ")").join("; ")}`,
        `Automations: ${dbContext.automations.map(a => a.name + " (" + (a.active ? "Active" : "Paused") + ")").join("; ")}`,
        `Subscriptions: ${dbContext.subscriptions.map(s => s.name + " (" + s.price + ")").join(", ")}`,
        `Vault Documents: ${dbContext.vaultDocuments.map(d => d.name + " (Expires " + d.expiryDate + ")").join(", ")}`,
      ].join("\n");

      const systemPrompt = `You are LifeSync AI, a highly intelligent, empathetic, proactive personal intelligence and obligation operating system.
You have access to the user's real-time personal ledger, tasks, subscriptions, and schedule.
You can answer ANY question the user asks — from specific questions about their obligations, bills, dates, reasoning, and savings, to general knowledge, coding, life advice, scheduling, writing, analysis, and problem-solving.
Be concise, helpful, insightful, and natural.

${liveContextSummary}`;

      // 1. If user supplied their own Gemini API key
      if (dbContext.user.geminiApiKey && dbContext.user.geminiApiKey.trim()) {
        try {
          const geminiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${dbContext.user.geminiApiKey.trim()}`;
          const contents = conversationHistory.slice(-6).map(msg => ({
            role: msg.role === "assistant" ? "model" : "user",
            parts: [{ text: msg.text }]
          }));
          contents.push({ role: "user", parts: [{ text: prompt }] });

          const res = await fetch(geminiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents,
              systemInstruction: { parts: [{ text: systemPrompt }] }
            })
          });
          if (res.ok) {
            const data = await res.json();
            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) return text;
          }
        } catch (e) {
          console.warn("Direct Gemini API key failed, falling back to public neural endpoint", e);
        }
      }

      // 2. High-speed Live Multi-Model LLM Endpoint (Pollinations AI Open LLM Engine)
      try {
        const messages = [
          { role: "system", content: systemPrompt },
          ...conversationHistory.slice(-4).map(m => ({ role: m.role, content: m.text })),
          { role: "user", content: prompt }
        ];

        const response = await fetch("https://text.pollinations.ai/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages,
            model: "openai",
            seed: 42,
            jsonMode: false
          })
        });

        if (response.ok) {
          const text = await response.text();
          if (text && text.trim()) return text.trim();
        }
      } catch (err) {
        console.warn("Public neural LLM error:", err);
      }

      // 3. Robust Contextual Local Reasoning Engine Fallback (Instant & accurate)
      const q = prompt.toLowerCase();
      if (q.includes("insurance") || q.includes("oct 11") || q.includes("renew") || q.includes("vehicle") || q.includes("car")) {
        return `Your Hyundai Creta insurance (HDFC ERGO) expires on Oct 15. Because endorsement takes 2–3 business days at HDFC ERGO and your Goa road trip starts on Saturday, Oct 17, LifeSync recommends paying by Friday, Oct 11. This prevents weekend banking freezes and guarantees active zero-dep and roadside assistance before departure.`;
      }
      if (q.includes("save") || q.includes("subscription") || q.includes("cloud") || q.includes("storage")) {
        return `You currently have overlapping 2TB quotas on both Google One (₹6,500/yr) and Apple iCloud+ (₹749/mo). Consolidating into one provider will save you ₹1,200 every month (₹14,400/year).`;
      }
      if (q.includes("passport") || q.includes("travel") || q.includes("document")) {
        return `Your Indian Passport (Z9401824) expires in June 2027 (approx 180 days remaining). Because most international destinations require a minimum of 6 months validity, you can submit a Tatkaal renewal via the Document Vault anytime.`;
      }
      if (q.includes("load") || q.includes("strain") || q.includes("cognitive") || q.includes("summary") || q.includes("overview")) {
        return `Overview for ${dbContext.user.name}: You have ${dbContext.metrics.criticalObligations} critical obligations queued. Cognitive load is currently at ${dbContext.metrics.cognitiveLoadPct}%. Your next deadline is ${dbContext.adminItems[0]?.title || "Vehicle Insurance Renewal"}.`;
      }

      return `I have analyzed your query regarding "${prompt}". As your LifeSync AI operating system, I am actively monitoring your connected sources (Gmail, HDFC, Vahan, BESCOM, iCloud, Figma) to keep your schedule, finances, and travel completely protected.`;
    }

                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 6. RELATIONSHIP GRAPH MODAL */}
          {graphModalOpen && (
            <div className="modal-overlay" onClick={() => setGraphModalOpen(false)}>
              <div className="modal modal--lg" onClick={(e) => e.stopPropagation()}>
                <div className="modal__head">
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <Icon name="graph" size={16} style={{ color: "var(--blue-soft)" }} />
                    <h3 className="modal__title">Relationship Graph Inspector</h3>
                  </div>
                  <button className="icon-btn icon-btn--sm" onClick={() => setGraphModalOpen(false)}>
                    <Icon name="close" size={16} />
                  </button>
                </div>

                <div className="modal__body">
                  <p style={{ color: "var(--text-secondary)", fontSize: 13 }}>
                    Autonomous causal dependency chain resolved for <strong>Vehicle Insurance</strong>:
                  </p>

                  <div className="graph-node-container">
                    <div className="graph-node graph-node--danger">
                      <div>
                        <strong>Gmail Notification</strong>
                        <p style={{ fontSize: 12, color: "var(--text-muted)" }}>Policy expiry notice from HDFC ERGO detected on Oct 9</p>
                      </div>
                      <span className="chip chip--live">Input Node</span>
                    </div>
                    <div style={{ textAlign: "center", color: "var(--text-muted)", fontSize: 12, fontWeight: 700 }}>↓ connects to</div>
                    <div className="graph-node">
                      <div>
                        <strong>Vahan National Ledger</strong>
                        <p style={{ fontSize: 12, color: "var(--text-muted)" }}>Hyundai Creta KA-01-MJ-4021 record verified</p>
                      </div>
                      <span className="chip chip--sync">Verified</span>
                    </div>
                    <div style={{ textAlign: "center", color: "var(--text-muted)", fontSize: 12, fontWeight: 700 }}>↓ collides with</div>
                    <div className="graph-node graph-node--violet">
                      <div>
                        <strong>Calendar Road Trip: Oct 17</strong>
                        <p style={{ fontSize: 12, color: "var(--text-muted)" }}>Goa departure requires active zero-dep policy &amp; road assistance</p>
                      </div>
                      <span className="chip chip--engine">Constraint</span>
                    </div>
                  </div>
                </div>

                <div className="modal__foot">
                  <button className="btn btn--blue" onClick={() => setGraphModalOpen(false)}>
                    Understood
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 7. DOCTOR PREP MODAL */}
          {directionsModalOpen && (
            <div className="modal-overlay" onClick={() => setDirectionsModalOpen(false)}>
              <div className="modal" onClick={(e) => e.stopPropagation()}>
                <div className="modal__head">
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <Icon name="medical" size={16} style={{ color: "var(--indigo)" }} />
                    <h3 className="modal__title">Dr. Sharma Consultation Prep</h3>
                  </div>
                  <button className="icon-btn icon-btn--sm" onClick={() => setDirectionsModalOpen(false)}>
                    <Icon name="close" size={16} />
                  </button>
                </div>

                <div className="modal__body">
                  <div style={{ padding: 14, background: "var(--bg-item)", borderRadius: "var(--r-md)" }}>
                    <p style={{ fontWeight: 700, fontSize: 14 }}>Apollo Specialty Hospital, Indiranagar</p>
                    <p style={{ color: "var(--text-secondary)", fontSize: 12, marginTop: 4 }}>
                      Time: Today @ 4:30 PM • Slot #14 • 2nd Floor, Room 204
                    </p>
                  </div>

                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    <p className="eyebrow">Preparation Checklist</p>
                    <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}>
                      <input type="checkbox" defaultChecked /> Carry recent blood test report (saved in Document Vault)
                    </label>
                    <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}>
                      <input type="checkbox" defaultChecked /> Fasting requirement not required
                    </label>
                    <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}>
                      <input type="checkbox" defaultChecked /> Estimated travel time: 25 mins via Old Airport Rd
                    </label>
                  </div>
                </div>

                <div className="modal__foot">
                  <button className="btn btn--text" onClick={() => setDirectionsModalOpen(false)}>
                    Dismiss
                  </button>
                  <button className="btn btn--blue" onClick={handleCompleteDoctorPrep}>
                    Mark Prep Completed
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 8. FIGMA REVIEW MODAL */}
          {reviewModalOpen && (
            <div className="modal-overlay" onClick={() => setReviewModalOpen(false)}>
              <div className="modal" onClick={(e) => e.stopPropagation()}>
                <div className="modal__head">
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <Icon name="review" size={16} style={{ color: "var(--danger-soft)" }} />
                    <h3 className="modal__title">Figma Professional Plan Review</h3>
                  </div>
                  <button className="icon-btn icon-btn--sm" onClick={() => setReviewModalOpen(false)}>
                    <Icon name="close" size={16} />
                  </button>
                </div>

                <div className="modal__body">
                  <div style={{ padding: 14, background: "rgba(147, 0, 10, 0.2)", borderRadius: "var(--r-md)", border: "1px solid rgba(255, 180, 171, 0.2)" }}>
                    <p style={{ fontWeight: 700, color: "var(--danger-soft)" }}>Price Increase Alert (+₹200/mo)</p>
                    <p style={{ color: "var(--text-secondary)", fontSize: 13, marginTop: 4 }}>
                      Your monthly rate adjusted from ₹1,099/mo to ₹1,299/mo starting tomorrow.
                    </p>
                  </div>

                  <p style={{ color: "var(--text-secondary)", fontSize: 13 }}>
                    LifeSync verified you have 4 active design projects in this workspace over the last 30 days.
                  </p>
                </div>

                <div className="modal__foot">
                  <button className="btn btn--danger-ghost" onClick={() => {
                    setReviewModalOpen(false);
                    showToast("Cancellation reminder queued for Figma", "success");
                  }}>
                    Queue Cancellation
                  </button>
                  <button className="btn btn--blue" onClick={() => {
                    setReviewModalOpen(false);
                    showToast("Figma plan maintained", "info");
                  }}>
                    Keep Subscription
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification Container */}
          <div className="toasts">
            {toasts.map((t) => (
              <div className={`toast toast--${t.tone}`} key={t.id}>
                <Icon name={t.tone === "success" ? "checkCircle" : t.tone === "error" ? "alert" : "sparkle"} size={16} />
                <span>{t.message}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
