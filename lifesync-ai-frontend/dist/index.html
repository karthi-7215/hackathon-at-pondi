<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f131c" />
  <title>LifeSync AI — Main Intelligent Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  
  <!-- React 18 & Babel for standalone browser runtime -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ================= DESIGN TOKENS ================= */
    :root {
      --bg-app: #0f131c;
      --bg-sidebar: #0a0e17;
      --bg-card: #181b25;
      --bg-item: #1c1f29;
      --bg-item-soft: rgba(28, 31, 41, 0.6);
      --bg-chip: #262a34;
      --bg-chip-strong: #31353f;
      --bg-reasoning: rgba(10, 14, 23, 0.8);
      --bg-header: rgba(15, 19, 28, 0.85);

      --text-primary: #dfe2ef;
      --text-secondary: #c2c6d6;
      --text-muted: #8c909f;

      --blue: #4d8eff;
      --blue-soft: #adc6ff;
      --indigo: #c0c1ff;
      --violet: #d0bcff;
      --violet-glow: #a078ff;
      --danger: #93000a;
      --danger-soft: #ffb4ab;
      --danger-text: #ffdad6;
      --danger-bg: rgba(147, 0, 10, 0.3);
      --indigo-bg: rgba(49, 49, 192, 0.4);
      --indigo-badge: #3131c0;
      --indigo-badge-text: #b0b2ff;
      --on-blue: #00285d;
      --on-blue-soft: #002e6a;

      --font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      --font-body: "Inter", system-ui, -apple-system, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

      --r-xs: 4px;
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --r-pill: 9999px;

      --shadow-card: 0 1px 1px rgba(0, 0, 0, 0.05);
      --shadow-hero: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);

      --sidebar-w: 288px;
      --header-h: 64px;
      --content-max: 992px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { height: 100%; }
    body {
      margin: 0;
      background: var(--bg-app);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 20px;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, p { margin: 0; }
    ul { list-style: none; margin: 0; padding: 0; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    svg { display: block; flex-shrink: 0; }
    :focus-visible { outline: 2px solid var(--blue-soft); outline-offset: 2px; }

    /* Shell & Layout */
    .shell { min-height: 100%; display: flex; flex-direction: column; }
    .main { margin-left: var(--sidebar-w); min-width: 0; flex: 1; display: flex; flex-direction: column; }
    .content {
      position: relative;
      max-width: var(--content-max);
      margin: 0 auto;
      width: 100%;
      padding: 40px 24px 64px;
      display: flex;
      flex-direction: column;
    }

    /* Aura */
    .aura { position: absolute; inset: 0 0 auto 0; height: 256px; overflow: hidden; pointer-events: none; }
    .aura__a { position: absolute; border-radius: var(--r-pill); left: 25%; width: 41%; height: 384px; top: -96px; background: rgba(77, 142, 255, 0.1); filter: blur(50px); }
    .aura__b { position: absolute; border-radius: var(--r-pill); left: 12.4%; width: 54%; height: 320px; top: -112px; background: rgba(160, 120, 255, 0.15); filter: blur(60px); }

    /* Sidebar */
    .sidebar {
      position: fixed; inset: 0 auto 0 0;
      width: var(--sidebar-w);
      background: var(--bg-sidebar);
      display: flex; flex-direction: column;
      z-index: 40;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
      border-right: 1px solid rgba(255, 255, 255, 0.03);
    }
    .sidebar__brand { height: var(--header-h); padding: 0 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand__logo {
      width: 32px; height: 32px; border-radius: var(--r-sm);
      display: grid; place-items: center;
      color: var(--blue-soft);
      background: linear-gradient(140deg, rgba(77,142,255,.25), rgba(160,120,255,.25));
      box-shadow: inset 0 0 0 1px rgba(173,198,255,.25);
    }
    .brand__name { font: 600 16px/24px var(--font-display); letter-spacing: -0.4px; }
    .sidebar__nav { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 12px; }
    .nav-section { display: flex; flex-direction: column; gap: 4px; }
    .nav-section__label { padding: 5px 8px 7px; font: 600 11px/14px var(--font-body); letter-spacing: .55px; text-transform: uppercase; color: var(--text-muted); }
    .nav-link {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px 10px; min-height: 34px; border-radius: var(--r-sm);
      font: 500 13px/18px var(--font-body); color: var(--text-secondary);
      transition: background-color .15s, color .15s;
    }
    .nav-link:hover { background: var(--bg-item); color: var(--text-primary); }
    .nav-link__main { display: flex; align-items: center; gap: 8px; }
    .nav-link--active, .nav-link--active:hover { background: var(--blue); color: var(--on-blue); font-weight: 600; }
    .nav-badge { padding: 2px 6px; border-radius: var(--r-pill); font: 600 10px/12px var(--font-body); }
    .nav-badge--indigo { background: var(--indigo-badge); color: var(--indigo-badge-text); }
    .nav-badge--neutral { background: var(--bg-chip); color: var(--blue-soft); }
    .nav-badge--danger { background: var(--danger); color: var(--danger-text); }

    .sidebar__footer { padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg-sidebar); border-top: 1px solid rgba(255,255,255,0.03); }
    .status-card { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--r-sm); background: var(--bg-item); }
    .status-card__text { min-width: 0; }
    .status-card__title { font: 600 11px/14px var(--font-body); }
    .status-card__sub { font: 400 11px/16px var(--font-body); color: var(--text-secondary); }
    .profile { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 0; }
    .profile__who { display: flex; align-items: center; gap: 8px; }
    .profile__name { font: 600 12px/16px var(--font-body); }
    .profile__email { font: 400 11px/14px var(--font-body); color: var(--text-muted); }
    .scrim { display: none; }

    /* Header */
    .header {
      position: sticky; top: 0; z-index: 30;
      height: var(--header-h);
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 0 24px;
      background: var(--bg-header);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      box-shadow: 0 1px 8px rgba(0, 0, 0, 0.15);
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    .header__menu { display: none; }
    .search { position: relative; flex: 1; min-width: 0; max-width: 480px; }
    .search__icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
    .search__input {
      width: 100%; height: 38px; padding: 0 54px 0 34px;
      background: var(--bg-card); color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.05); border-radius: var(--r-sm);
      font: 400 13px/normal var(--font-body);
      transition: border-color .15s, box-shadow .15s;
    }
    .search__input:focus { outline: none; border-color: rgba(173,198,255,.5); box-shadow: 0 0 0 2px rgba(77, 142, 255, 0.2); }
    .search__kbd {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      padding: 2px 6px; border-radius: var(--r-xs); background: var(--bg-chip);
      font: 500 10px/12px var(--font-mono); color: var(--text-secondary);
    }
    .search-dropdown {
      position: absolute; top: calc(100% + 6px); left: 0; right: 0;
      background: var(--bg-card); border-radius: var(--r-md);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.08);
      max-height: 320px; overflow-y: auto; z-index: 50; padding: 6px;
    }
    .search-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; border-radius: var(--r-sm); cursor: pointer;
      transition: background .15s;
    }
    .search-item:hover { background: var(--bg-item); }
    .search-item__title { font-weight: 500; font-size: 13px; }
    .search-item__type { font-size: 11px; color: var(--blue-soft); background: var(--bg-chip); padding: 2px 6px; border-radius: var(--r-xs); }

    .header__actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .header__divider { width: 1px; height: 28px; background: var(--bg-chip-strong); margin: 0 4px; }
    .header__bell { position: relative; }
    .header__bell-dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--blue-soft); }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 38px; padding: 0 14px; border-radius: var(--r-sm);
      font: 500 12px/16px var(--font-body); letter-spacing: .24px; white-space: nowrap;
      transition: filter .15s, background-color .15s, transform .05s;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.1); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: .65; cursor: default; }
    .btn--sm { height: 34px; padding: 0 12px; }
    .btn--xs { height: auto; padding: 4px 8px; font-size: 11px; font-weight: 600; border-radius: var(--r-xs); }
    .btn--lg { height: 46px; border-radius: var(--r-md); font-size: 14px; letter-spacing: .14px; }
    .btn--blue { background: var(--blue); color: var(--on-blue); font-weight: 600; box-shadow: var(--shadow-card); }
    .btn--soft-blue { background: var(--blue-soft); color: var(--on-blue-soft); font-weight: 600; padding: 0 20px; box-shadow: 0 4px 10px rgba(77, 142, 255, 0.2); }
    .btn--chip { background: var(--bg-chip-strong); color: var(--text-primary); }
    .btn--lg.btn--chip { background: var(--bg-chip); }
    .btn--ghost-violet { background: var(--bg-card); color: var(--violet); border: 1px solid rgba(208, 188, 255, 0.15); box-shadow: 0 0 12px rgba(160, 120, 255, 0.12); }
    .btn--text { height: 38px; padding: 0 8px; color: var(--text-secondary); }
    .btn--text:hover:not(:disabled) { background: var(--bg-chip); filter: none; }

    .icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: var(--r-sm); color: var(--text-secondary); }
    .icon-btn:hover { background: var(--bg-chip); color: var(--text-primary); }
    .icon-btn--sm { width: 28px; height: 28px; }

    .link-btn { display: inline-flex; align-items: center; gap: 4px; font: 600 11px/14px var(--font-body); letter-spacing: .44px; color: var(--text-muted); text-decoration: underline; }
    .link-btn:hover:not(:disabled) { color: var(--text-primary); }
    .link-btn--indigo { color: var(--indigo); text-decoration: none; }
    .link-btn--indigo:hover:not(:disabled) { color: var(--text-primary); }

    /* Chips, Badges & Utilities */
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: var(--r-pill); background: var(--bg-chip); font: 600 11px/14px var(--font-body); letter-spacing: .44px; color: var(--text-secondary); }
    .chip--blue-text { border-radius: var(--r-xs); padding: 2px 4px; color: var(--blue-soft); }
    .chip--sync { background: var(--bg-card); padding: 6px 10px; border: 1px solid rgba(255,255,255,0.03); }
    .chip--engine { padding: 5px 10px; color: var(--violet); background: rgba(208, 188, 255, 0.08); border: 1px solid rgba(208, 188, 255, 0.15); box-shadow: var(--shadow-card); }
    .chip--count { color: var(--text-secondary); font-weight: 600; }
    .chip--live { border-radius: var(--r-xs); padding: 2px 6px; background: rgba(208,188,255,.1); color: var(--violet); }
    .chip--urgent { padding: 4px 8px; background: var(--danger); color: var(--danger-text); letter-spacing: 0.8px; text-transform: uppercase; }
    .chip--confidence { padding: 4px 8px; color: var(--violet); background: rgba(208, 188, 255, 0.06); }

    .dot { width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--text-muted); flex-shrink: 0; }
    .dot--violet { background: var(--violet); }
    .dot--blue { background: var(--blue-soft); }
    .dot--indigo { background: var(--indigo); }
    .dot--danger { background: var(--danger-soft); }
    .dot--pink { width: 6px; height: 6px; background: var(--danger-text); }

    .sep { color: var(--text-muted); }
    .mono { font: 700 13px/20px var(--font-mono); color: var(--blue-soft); }
    .accent { color: var(--blue-soft); }
    .eyebrow { font: 600 11px/14px var(--font-body); letter-spacing: .55px; text-transform: uppercase; color: var(--text-muted); }
    .eyebrow--icon { display: flex; align-items: center; gap: 4px; }
    .avatar { display: inline-grid; place-items: center; border-radius: var(--r-pill); overflow: hidden; background: linear-gradient(140deg, #4d8eff, #a078ff); font: 600 12px/1 var(--font-body); color: #fff; flex-shrink: 0; }

    /* Cards */
    .card { background: var(--bg-card); border-radius: var(--r-lg); box-shadow: var(--shadow-card); border: 1px solid rgba(255, 255, 255, 0.03); }

    /* Greeting Section */
    .greeting { position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 24px; }
    .greeting__copy { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; max-width: 640px; }
    .greeting__title { font: 700 44px/52px var(--font-display); letter-spacing: -1px; }
    .greeting__lead { font: 600 19px/26px var(--font-display); letter-spacing: -.2px; color: var(--text-secondary); }
    .greeting__lead strong { font-weight: 600; color: var(--blue-soft); }
    .metrics { display: flex; gap: 10px; flex-shrink: 0; }
    .metric { display: flex; align-items: center; gap: 10px; padding: 6px 16px; background: var(--bg-card); border-radius: var(--r-md); border: 1px solid rgba(255,255,255,0.03); }
    .metric__icon { display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--r-sm); background: var(--bg-chip); color: var(--blue-soft); }
    .metric__label { font: 600 11px/14px var(--font-body); letter-spacing: .55px; text-transform: uppercase; color: var(--text-muted); }
    .metric__value { font: 600 16px/24px var(--font-display); }
    .metric__delta { font-size: 12px; color: var(--danger-soft); }

    /* Hero Priority Card */
    .hero { position: relative; overflow: hidden; margin-bottom: 32px; box-shadow: var(--shadow-hero); border: 1px solid rgba(255,255,255,0.05); }
    .hero__glow { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(160,120,255,.12), rgba(77,142,255,.08) 50%, rgba(77,142,255,0)); pointer-events: none; }
    .hero__edge { position: absolute; inset: 0 auto 0 0; width: 6px; background: linear-gradient(180deg, var(--violet), var(--blue) 50%, var(--indigo)); }
    .hero__body { position: relative; padding: 32px; display: flex; flex-direction: column; gap: 18px; }
    .hero__meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .hero__badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .hero__detected { display: inline-flex; align-items: center; gap: 4px; font: 500 12px/16px var(--font-body); color: var(--text-muted); }
    .hero__head { display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); gap: 24px; }
    .hero__titles { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .hero__title { font: 700 30px/38px var(--font-display); letter-spacing: -.6px; }
    .hero__sub { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 400 14px/22px var(--font-body); }
    .tag { padding: 2px 8px; border-radius: var(--r-xs); background: var(--bg-item); font-weight: 500; }
    .hero__expiry { display: flex; align-items: center; gap: 6px; font: 500 14px/22px var(--font-body); color: var(--danger-soft); }
    .hero__price { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
    .hero__amount { font: 700 44px/52px var(--font-display); letter-spacing: -1px; }
    .hero__recommend { display: flex; align-items: center; gap: 4px; padding-top: 4px; font: 600 12px/16px var(--font-body); color: var(--blue-soft); }

    .reasoning { display: flex; flex-direction: column; gap: 12px; padding: 20px 16px; border-radius: var(--r-md); background: var(--bg-reasoning); border: 1px solid rgba(255,255,255,0.03); }
    .reasoning__flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .reasoning__step { display: inline-flex; align-items: center; gap: 8px; }
    .reasoning__arrow { color: var(--text-muted); }
    .flow-tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: var(--r-sm); background: var(--bg-chip); font: 500 12px/16px var(--font-body); }
    .flow-tag__src { color: var(--text-muted); }
    .reasoning__narrative { font: 400 14px/22px var(--font-body); color: var(--text-secondary); }
    .reasoning__narrative strong { font-weight: 600; color: var(--text-primary); }
    .reasoning__narrative strong.accent { color: var(--blue-soft); }

    .hero__actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 8px; }
    .hero__primary, .hero__secondary { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* Workspace 2-Column */
    .workspace { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; align-items: start; }
    .workspace__col { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
    .workspace__col--main { grid-column: 1 / span 7; }
    .workspace__col--side { grid-column: 8 / span 5; }

    .panel { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .panel__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .panel__title-group { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .panel__icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: var(--r-sm); background: var(--bg-chip); color: var(--blue-soft); flex-shrink: 0; }
    .panel__title { font: 700 19px/26px var(--font-display); letter-spacing: -.2px; }
    .panel__sub { font: 400 12px/18px var(--font-body); color: var(--text-muted); }
    .panel__range { font: 600 11px/14px var(--font-body); color: var(--text-muted); white-space: nowrap; }

    .stack { display: flex; flex-direction: column; gap: 8px; }
    .stack--tight { gap: 6px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: var(--r-md); background: var(--bg-item); border: 1px solid rgba(255,255,255,0.02); }
    .row--soft { padding: 8px 12px; background: var(--bg-item-soft); }
    .row__main { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
    .row__main--center { align-items: center; }
    .row__icon { display: grid; place-items: center; width: 38px; height: 38px; border-radius: var(--r-md); background: var(--bg-chip-strong); color: var(--blue-soft); flex-shrink: 0; }
    .row__text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .row__title-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
    .row__title { font: 600 15px/22px var(--font-display); }
    .row__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font: 400 12px/18px var(--font-body); color: var(--text-muted); }
    .row__meta strong { font-weight: 600; color: var(--text-primary); }
    .row__meta--danger { color: var(--danger-soft); }
    .row__meta--soft { color: var(--text-secondary); gap: 6px; }

    .badge { padding: 2px 6px; border-radius: var(--r-xs); font: 600 11px/14px var(--font-body); white-space: nowrap; }
    .badge--danger { background: var(--danger-bg); color: var(--danger-soft); }
    .badge--indigo { background: var(--indigo-bg); color: var(--indigo); }
    .badge--neutral { background: var(--bg-chip-strong); color: var(--text-primary); }

    .date-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 44px; height: 40px; border-radius: var(--r-sm); background: var(--bg-chip); flex-shrink: 0; }
    .date-tile__month { font: 600 10px/12px var(--font-body); text-transform: uppercase; color: var(--text-muted); }
    .date-tile__day { font: 700 15px/16px var(--font-display); }
    .status { padding: 3px 6px; border-radius: var(--r-xs); background: var(--bg-chip); font: 600 11px/14px var(--font-body); white-space: nowrap; }
    .status--neutral { color: var(--text-primary); }
    .status--indigo { color: var(--indigo); }
    .status--muted { color: var(--text-muted); }

    /* Load Chart */
    .chart { display: flex; flex-direction: column; gap: 16px; padding: 16px; border-radius: var(--r-md); background: var(--bg-item); }
    .chart__bars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) minmax(0, 1.4fr); gap: 8px; align-items: end; height: 144px; padding-top: 24px; }

          response: `LifeSync Neural Engine has cross-correlated your Gmail receipts, Vahan vehicle ledger, and Calendar Goa trip. Paying your vehicle insurance by October 11 avoids weekend endorsement lags before your departure on October 17.`,
        };
      },

      async quickAdd(title, amount) {
        try {
          const res = await fetch("/api/quick-add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, amount }),
          });
          if (res.ok) return await res.json();
        } catch (e) {}
        return { ok: true, message: `Added "${title}" to your queue` };
      },
    };

    // --- Main App Component ---
    function App() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [busy, setBusy] = useState({});
      const [done, setDone] = useState({});
      const [toasts, setToasts] = useState([]);
      const [navOpen, setNavOpen] = useState(false);
      const [activeNav, setActiveNav] = useState("dashboard");

      // Modals State
      const [aiModalOpen, setAiModalOpen] = useState(false);
      const [quickAddOpen, setQuickAddOpen] = useState(false);
      const [graphModalOpen, setGraphModalOpen] = useState(false);
      const [aiPrompt, setAiPrompt] = useState("");
      const [aiResponse, setAiResponse] = useState(null);
      const [aiBusy, setAiBusy] = useState(false);

      // Quick Add form state
      const [qaTitle, setQaTitle] = useState("");
      const [qaAmount, setQaAmount] = useState("");

      // Search State
      const [searchQuery, setSearchQuery] = useState("");
      const [searchResults, setSearchResults] = useState([]);
      const searchRef = useRef(null);

      const pushToast = useCallback((message, tone = "success") => {
        const id = Date.now() + Math.random();
        setToasts((prev) => [...prev, { id, message, tone }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 3500);
      }, []);

      const loadData = useCallback(async () => {
        setLoading(true);
        try {
          const res = await backend.getDashboard();
          setData(res);
        } catch (err) {
          pushToast("Could not load dashboard", "error");
        } finally {
          setLoading(false);
        }
      }, [pushToast]);

      useEffect(() => {
        loadData();
      }, [loadData]);

      // Keyboard Shortcut (⌘K / Ctrl+K)
      useEffect(() => {
        const onKeyDown = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
            e.preventDefault();
            searchRef.current?.focus();
          }
        };
        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
      }, []);

      // Search Handler
      const handleSearch = async (val) => {
        setSearchQuery(val);
        if (!val.trim()) {
          setSearchResults([]);
          return;
        }
        const res = await backend.search(val);
        setSearchResults(res.results || []);
      };

      const runAction = async (key, fn, markDone = false) => {
        setBusy((b) => ({ ...b, [key]: true }));
        try {
          const res = await fn();
          pushToast(res.message, res.ok ? "success" : "error");
          if (res.ok && markDone) setDone((d) => ({ ...d, [key]: true }));
        } catch (e) {
          pushToast("Action failed", "error");
        } finally {
          setBusy((b) => ({ ...b, [key]: false }));
        }
      };

      const handleAskAI = async (customPrompt) => {
        const query = customPrompt || aiPrompt;
        if (!query.trim()) return;
        setAiBusy(true);
        setAiResponse(null);
        try {
          const res = await backend.askAI(query);
          setAiResponse(res.response);
        } catch (e) {
          setAiResponse("AI assistant is processing in background. All rules validated.");
        } finally {
          setAiBusy(false);
        }
      };

      const handleQuickAddSubmit = async (e) => {
        e.preventDefault();
        if (!qaTitle.trim()) return;
        const res = await backend.quickAdd(qaTitle, qaAmount);
        pushToast(res.message, "success");
        if (data) {
          setData({
            ...data,
            metrics: {
              ...data.metrics,
              criticalObligations: data.metrics.criticalObligations + 1,
            },
            adminItems: [
              {
                id: "adm_" + Date.now(),
                icon: "sparkle",
                title: qaTitle,
                badge: { label: "New", tone: "indigo" },
                amountLabel: qaAmount ? `₹${qaAmount}` : undefined,
                meta: "Created via Quick Add",
                action: { label: "Review", variant: "primary", icon: "review" },
              },
              ...data.adminItems,
            ],
          });

        setQaTitle("");
        setQaAmount("");
        setQuickAddOpen(false);
      };

          <div className="state" aria-busy="true">
            <div className="skeleton skeleton--title" />
            <div className="skeleton skeleton--hero" />
            <div className="skeleton skeleton--row" />
          </div>
        );

        <div className="shell">

              </div>

                  className="search__input"

                  {/* Hero Actions */}

                      <button

                        onClick={() =>

                  {/* Today's Critical Admin */}

                                        true
                                      )
                                    }
                                    disabled={isBusy}
                                  >
                                    {it.cta.label}
                                    <Icon name="external" size={11} />
                                  </button>
                                </div>
                              )}
                            </div>
                          </li>
                        );
                      })}
                    </ul>
                  </section>
                </div>
              </div>
            </main>
          </div>

          {/* Modal: Ask LifeSync AI */}
          {aiModalOpen && (
            <div className="modal-overlay" onClick={() => setAiModalOpen(false)}>
              <div className="modal" onClick={(e) => e.stopPropagation()}>
                <div className="modal__head">
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <Icon name="sparkle" size={18} style={{ color: "var(--violet)" }} />
                    <h3 className="modal__title">Ask LifeSync AI</h3>
                  </div>
                  <button className="icon-btn icon-btn--sm" onClick={() => setAiModalOpen(false)}>
                    <Icon name="close" size={16} />
                  </button>
                </div>
                <div className="modal__body">
                  <p style={{ color: "var(--text-secondary)", fontSize: 13 }}>
                    Ask anything about your connected obligations, cross-app schedules, or automated payments:
                  </p>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {[
                      "Why renew insurance on Oct 11?",
                      "Summarize my obligations for this week",
                      "How can I save on cloud subscriptions?",
                    ].map((s, idx) => (
                      <button
                        key={idx}
                        className="btn btn--xs btn--chip"
                        onClick={() => {
                          setAiPrompt(s);
                          handleAskAI(s);
                        }}
                      >
                        {s}
                      </button>
                    ))}
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <input
                      type="text"
                      className="input-field"
                      placeholder="e.g. Can I postpone my vehicle service?"
                      value={aiPrompt}
                      onChange={(e) => setAiPrompt(e.target.value)}
                      onKeyDown={(e) => e.key === "Enter" && handleAskAI()}
                    />
                    <button className="btn btn--blue" onClick={() => handleAskAI()} disabled={aiBusy}>
                      {aiBusy ? "Thinking…" : "Ask"}
                    </button>
                  </div>
                  {aiResponse && (
                    <div
                      style={{
                        padding: 14,
                        borderRadius: "var(--r-sm)",
                        background: "var(--bg-item)",
                        borderLeft: "3px solid var(--violet)",
                        lineHeight: "22px",
                      }}
                    >
                      <p style={{ fontWeight: 600, color: "var(--violet)", marginBottom: 4 }}>
                        LifeSync Neural Summary:
                      </p>
                      <p style={{ color: "var(--text-primary)" }}>{aiResponse}</p>
                    </div>
                  )}
                </div>
                <div className="modal__foot">
                  <button className="btn btn--chip" onClick={() => setAiModalOpen(false)}>
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal: Quick Add */}
          {quickAddOpen && (
            <div className="modal-overlay" onClick={() => setQuickAddOpen(false)}>
              <div className="modal" onClick={(e) => e.stopPropagation()}>
                <div className="modal__head">
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <Icon name="plus" size={16} style={{ color: "var(--blue)" }} />
                    <h3 className="modal__title">Quick Add Obligation</h3>
                  </div>
                  <button className="icon-btn icon-btn--sm" onClick={() => setQuickAddOpen(false)}>
                    <Icon name="close" size={16} />
                  </button>
                </div>
                <form onSubmit={handleQuickAddSubmit}>
                  <div className="modal__body">
                    <div>
                      <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "var(--text-muted)", marginBottom: 6 }}>
                        OBLIGATION / TASK TITLE
                      </label>
                      <input
                        type="text"
                        className="input-field"
                        placeholder="e.g. Broadband Fiber Bill"
                        required
                        value={qaTitle}
                        onChange={(e) => setQaTitle(e.target.value)}
                      />
                    </div>
                    <div>
                      <label style={{ display: "block", fontSize: 12, fontWeight: 600, color: "var(--text-muted)", marginBottom: 6 }}>
                        AMOUNT (OPTIONAL)
                      </label>
                      <input
                        type="text"
                        className="input-field"
                        placeholder="e.g. 1,499"
                        value={qaAmount}
                        onChange={(e) => setQaAmount(e.target.value)}
                      />
                    </div>
                  </div>
                  <div className="modal__foot">
                    <button type="button" className="btn btn--text" onClick={() => setQuickAddOpen(false)}>
                      Cancel
                    </button>
                    <button type="submit" className="btn btn--blue">
                      Add to Queue
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal: Relationship Graph Inspector */}
          {graphModalOpen && (
            <div className="modal-overlay" onClick={() => setGraphModalOpen(false)}>
              <div className="modal" onClick={(e) => e.stopPropagation()}>
                <div className="modal__head">
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <Icon name="graph" size={16} style={{ color: "var(--blue-soft)" }} />
                    <h3 className="modal__title">Relationship Graph Inspector</h3>
                  </div>
                  <button className="icon-btn icon-btn--sm" onClick={() => setGraphModalOpen(false)}>
                    <Icon name="close" size={16} />
                  </button>
                </div>
                <div className="modal__body">
                  <p style={{ color: "var(--text-secondary)", fontSize: 13 }}>
                    Autonomous causal dependency chain resolved for <strong>Vehicle Insurance</strong>:
                  </p>
                  <div className="graph-node-container">
                    <div className="graph-node graph-node--danger">
                      <div>
                        <strong>Gmail Notification</strong>
                        <p style={{ fontSize: 12, color: "var(--text-muted)" }}>Policy expiry notice from HDFC ERGO detected on Oct 9</p>
                      </div>
                      <span className="chip chip--live">Input Node</span>
                    </div>
                    <div style={{ textAlign: "center", color: "var(--text-muted)", fontSize: 12 }}>↓ connects to</div>
                    <div className="graph-node">
                      <div>
                        <strong>Vahan National Ledger</strong>
                        <p style={{ fontSize: 12, color: "var(--text-muted)" }}>Hyundai Creta KA-01-MJ-4021 record verified</p>
                      </div>
                      <span className="chip chip--sync">Verified</span>
                    </div>
                    <div style={{ textAlign: "center", color: "var(--text-muted)", fontSize: 12 }}>↓ collides with</div>
                    <div className="graph-node graph-node--violet">
                      <div>
                        <strong>Calendar Road Trip: Oct 17</strong>
                        <p style={{ fontSize: 12, color: "var(--text-muted)" }}>Goa departure requires active zero-dep policy &amp; road assistance</p>
                      </div>
                      <span className="chip chip--engine">Constraint</span>
                    </div>
                  </div>
                </div>
                <div className="modal__foot">
                  <button className="btn btn--blue" onClick={() => setGraphModalOpen(false)}>
                    Understood
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toasts Notification Layer */}
          <div className="toasts">
            {toasts.map((t) => (
              <div className={`toast toast--${t.tone}`} key={t.id}>
                <Icon name={t.tone === "success" ? "check" : "alert"} size={16} />
                <span>{t.message}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
